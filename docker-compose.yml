services:
  a-stock-review:
    build: .
    container_name: a-stock-review
    restart: always
    ports:
      - "5000:5000"
    environment:
      - TZ=Asia/Shanghai
      - PORT=5000
      - AI_BASE_URL=${AI_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-doubao-seed-2-1-pro-260915}
    volumes:
      - ./reports:/app/reports
